services:
  postgres:
    image: postgres:16-alpine
    container_name: cleaning-app-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cleaning_app

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cleaning_app"]
      interval: 5s
      timeout: 5s
      retries: 5

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cleaning-app-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  cleaning-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cleaning-app

    env_file:
      - .env

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data: